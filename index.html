<style>
:root{--navy:#102a43;--blue:#2563eb;--sky:#eaf2ff;--ink:#172b4d;--muted:#6b7c93;--bg:#f5f7fb;--line:#e5eaf2;--white:#fff;--green:#138a5b;--amber:#b7791f;--red:#c24141;--shadow:0 10px 30px rgba(24,47,86,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.5px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.5px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-top:1px}.top-actions{display:flex;gap:10px;align-items:center}.pill{border-radius:999px;background:#edf4ff;color:#2457ad;font-size:12px;font-weight:800;padding:7px 12px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750;transition:.15s}.btn-primary{background:var(--blue);color:white}.btn-primary:hover{background:#1d4ed8}.btn-light{background:#eef2f7;color:#2d405c}.btn-outline{border:1px solid #d7e0ed;background:white;color:var(--ink)}.btn-danger{background:#fff0f0;color:#b42323}.wrap{max-width:1200px;margin:auto;padding:30px 24px 60px}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;align-items:stretch;margin-bottom:25px}.hero-main{border-radius:22px;padding:35px;color:white;background:radial-gradient(circle at 85% 20%,rgba(51,195,180,.5),transparent 25%),linear-gradient(125deg,#102a43,#164e8a 75%,#167e8b);position:relative;overflow:hidden}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.8px;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(30px,4vw,45px);line-height:1.08;letter-spacing:-1.5px;max-width:620px;margin:15px 0}.hero p{line-height:1.65;max-width:590px;color:#d8e8fa;margin-bottom:25px}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap}.hero .btn-light{background:white;color:#17365d}.hero-side{border-radius:22px;background:white;padding:25px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}.side-title{font-size:13px;font-weight:800;color:var(--muted)}.side-number{font-size:40px;font-weight:850;letter-spacing:-1px;margin:8px 0 2px}.side-caption{font-size:12px;color:var(--muted)}.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.mini-stat{padding:14px;border:1px solid var(--line);border-radius:13px}.mini-stat strong{font-size:23px;display:block}.mini-stat span{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:27px 0 14px}.section-head h2{font-size:21px;letter-spacing:-.5px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 3px 12px rgba(24,47,86,.025)}.dept-icon{height:44px;width:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:#eaf2ff;margin-bottom:16px}.card h3{margin:0 0 7px;font-size:16px}.card p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 14px}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:13px;font-size:11px;color:var(--muted)}.card-foot strong{color:var(--ink);font-size:13px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{display:flex;gap:13px}.feature .dept-icon{flex-shrink:0;margin:0}.feature h3{font-size:14px}.feature p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.footer{padding:24px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;background:white}.view{max-width:1200px;margin:auto;padding:28px 24px 60px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.page-head h1{margin:0;font-size:28px;letter-spacing:-.8px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat-card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat-card strong{display:block;font-size:29px;margin:8px 0 2px}.stat-card small{color:var(--muted);font-size:11px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 3px 12px rgba(24,47,86,.025)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-head h2{font-size:16px;margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap}.control{border:1px solid #d9e2ee;background:white;border-radius:9px;padding:10px 11px;color:var(--ink);min-width:140px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8290a5;background:#f8fafc;padding:13px 12px}td{padding:14px 12px;border-bottom:1px solid #edf0f5;font-size:12px}tr:last-child td{border-bottom:0}.complaint-title{font-weight:800;font-size:13px}.subtext{color:var(--muted);font-size:11px;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:850;background:#edf2f7;color:#53657b}.badge:before{content:'';width:5px;height:5px;background:currentColor;border-radius:50%}.b-pending{background:#fff5df;color:#9a6700}.b-progress{background:#e8f1ff;color:#2458b8}.b-resolved{background:#e4f8ed;color:#087849}.b-high{background:#ffebeb;color:#b42323}.b-medium{background:#fff5df;color:#9a6700}.b-low{background:#edf2f7;color:#607086}.actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 9px;color:#40536c;font-size:11px;font-weight:750}.empty{text-align:center;padding:35px;color:var(--muted)}.login-shell{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 15%,#e4eeff,transparent 35%),var(--bg)}.login-box{width:min(460px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.login-box h1{margin:0 0 7px;font-size:26px}.login-box>p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 22px}.form-row{margin-bottom:15px}.form-row label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.form-row input,.form-row select,.form-row textarea{width:100%;padding:12px;border:1px solid #d8e1ed;border-radius:10px;outline:none;background:white}.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#6b9bff;box-shadow:0 0 0 3px #eaf2ff}.form-row textarea{min-height:100px;resize:vertical}.full{width:100%}.switch-link{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}.link{color:var(--blue);font-weight:800;cursor:pointer}.notice{border-radius:10px;background:#eef5ff;color:#29558d;padding:11px 12px;font-size:11px;line-height:1.5;margin-top:14px}.notice strong{display:block;margin-bottom:3px}.error{background:#fff0f0;color:#a32121;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px}.modal-backdrop{position:fixed;inset:0;background:rgba(13,29,52,.48);z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 25px 80px #102a4333}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f0f3f8;border-radius:8px;padding:7px 10px}.toast{position:fixed;bottom:22px;right:22px;background:#102a43;color:white;border-radius:12px;padding:13px 17px;font-size:13px;box-shadow:var(--shadow);z-index:50;animation:up .2s ease}@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}.timeline{border-left:2px solid #dce7f8;margin:10px 0 0 7px;padding-left:17px}.timeline-item{position:relative;margin:0 0 16px}.timeline-item:before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--blue);left:-22px;top:4px}.timeline-item strong{font-size:12px}.timeline-item p{font-size:11px;color:var(--muted);margin:4px 0}.photo-preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px}.dept-banner{border-radius:17px;padding:22px;background:linear-gradient(110deg,#123451,#176c87);color:white;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.dept-banner h2{margin:0 0 5px}.dept-banner p{margin:0;color:#d9eaf4;font-size:12px}.demo-creds{font-size:11px;color:var(--muted);line-height:1.8;margin-top:10px}.role-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:850;margin-bottom:12px}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:1fr 1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 18px}.wrap{padding:22px 16px 45px}.view{padding:22px 16px 45px}.hero-main{padding:27px}.footer{padding:20px;flex-wrap:wrap}}@media(max-width:560px){.grid,.features,.stats-grid,.two-col{grid-template-columns:1fr}.top-actions .pill{display:none}.brand{font-size:17px}.topbar{height:64px}.page-head{align-items:flex-start;flex-direction:column}.hero h1{font-size:34px}.hero-main{padding:24px}.panel{padding:13px}.dept-banner{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div>JU CampusCare<small>JAHANGIRNAGAR UNIVERSITY</small></div></div><div class="top-actions"><span class="pill" id="headerRole">CAMPUS SUPPORT PORTAL</span><button class="btn btn-light" id="headerLogin" onclick="showLogin('student')">Student login</button><button class="btn btn-primary hidden" id="headerLogout" onclick="logout()">Log out</button></div></header>
<main id="app"></main><footer class="footer"><span>© 2026 JU CampusCare · Jahangirnagar University</span><span>A digital service portal concept for Jahangirnagar University, Savar, Bangladesh.</span></footer>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const DEPTS={Water:{icon:'💧',desc:'Leaks, taps, water supply and drainage'},Electricity:{icon:'⚡',desc:'Power failures, wiring, lights and electrical safety'},Construction:{icon:'🏗️',desc:'Buildings, classrooms, furniture and structural repairs'},Internet:{icon:'📶',desc:'Wi-Fi coverage, network outages and connectivity'},Medical:{icon:'🩺',desc:'Medical assistance and campus health facility issues'},Others:{icon:'🛠️',desc:'Campus issues that do not fit another category'}};
const DEMO_USERS=[{id:'u-admin',name:'Campus Administrator',email:'admin@campuscare.edu',password:'Admin@123',role:'admin'},...Object.keys(DEPTS).map(d=>({id:'u-dept-'+d.toLowerCase(),name:d+' Department',email:d.toLowerCase()+'@campuscare.edu',password:({Water:'Water@123',Electricity:'Electric@123',Construction:'Build@123',Internet:'Internet@123',Medical:'Medical@123',Others:'Others@123'})[d],role:'department',department:d}))];
const SEED=[{id:'CC-1024',studentId:'u-student',studentName:'Demo Student',title:'Water leakage near Block B',description:'Water is leaking from the pipe outside the second-floor washroom.',location:'Academic Block B · 2nd floor',category:'Water',priority:'High',status:'In Progress',department:'Water',eta:'2026-10-30',image:null,createdAt:'2026-10-28T09:20:00.000Z',updatedAt:'2026-10-29T07:15:00.000Z',updates:[{status:'Submitted',note:'Complaint submitted by student.',date:'2026-10-28T09:20:00.000Z'},{status:'In Progress',note:'Assigned to Water Department. Team is inspecting the pipe.',date:'2026-10-29T07:15:00.000Z'}]},{id:'CC-1023',studentId:'u-student',studentName:'Demo Student',title:'Wi-Fi not working in library',description:'The campus Wi-Fi is disconnecting repeatedly.',location:'Central Library · Reading zone',category:'Internet',priority:'Medium',status:'Pending',department:'Internet',eta:'',image:null,createdAt:'2026-10-27T12:00:00.000Z',updatedAt:'2026-10-27T12:00:00.000Z',updates:[{status:'Submitted',note:'Complaint submitted by student.',date:'2026-10-27T12:00:00.000Z'}]},{id:'CC-1022',studentId:'u-student',studentName:'Demo Student',title:'Broken classroom chair',description:'One chair has a broken leg and may be unsafe to use.',location:'Room 305 · Academic Block A',category:'Construction',priority:'Low',status:'Resolved',department:'Construction',eta:'2026-10-27',image:null,createdAt:'2026-10-25T08:00:00.000Z',updatedAt:'2026-10-27T10:00:00.000Z',updates:[{status:'Submitted',note:'Complaint submitted by student.',date:'2026-10-25T08:00:00.000Z'},{status:'Resolved',note:'Chair repaired and checked by maintenance staff.',date:'2026-10-27T10:00:00.000Z'}]}];
function load(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function mergeDemoUsers(saved){const users=(Array.isArray(saved)?saved:[]).filter(u=>u.email?.toLowerCase()!=='student@campuscare.edu');for(const demo of DEMO_USERS){const idx=users.findIndex(u=>u.email?.toLowerCase()===demo.email.toLowerCase());if(idx<0)users.push(demo);else if(demo.role==='department')users[idx]={...demo}}return users}
function save(){localStorage.setItem('cc_complaints',JSON.stringify(state.complaints));localStorage.setItem('cc_users',JSON.stringify(state.users))}
const state={users:mergeDemoUsers(load('cc_users',DEMO_USERS)),complaints:load('cc_complaints',SEED),user:load('cc_session',null),view:'home',filters:{status:'All',department:'All',priority:'All',q:''}};localStorage.setItem('cc_users',JSON.stringify(state.users));
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(date){if(!date)return 'Not set';return new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtTime(date){return new Date(date).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function badgeStatus(s){return `<span class="badge ${s==='Pending'?'b-pending':s==='In Progress'?'b-progress':s==='Resolved'?'b-resolved':''}">${esc(s)}</span>`}
function badgePriority(s){return `<span class="badge ${s==='High'?'b-high':s==='Medium'?'b-medium':'b-low'}">${esc(s)}</span>`}
function stats(list){return {total:list.length,pending:list.filter(c=>c.status==='Pending').length,progress:list.filter(c=>c.status==='In Progress').length,resolved:list.filter(c=>c.status==='Resolved').length}}
function allComplaints(){return [...state.complaints].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}
function home(){state.view='home';document.getElementById('headerRole').textContent=state.user?state.user.role==='admin'?'ADMINISTRATOR':state.user.role==='department'?`${state.user.department.toUpperCase()} DEPARTMENT`:'STUDENT DASHBOARD':'CAMPUS SUPPORT PORTAL';document.getElementById('headerLogin').classList.toggle('hidden',!!state.user);document.getElementById('headerLogout').classList.toggle('hidden',!state.user);const list=allComplaints(),s=stats(list);document.getElementById('app').innerHTML=`<div class="wrap"><section class="hero"><div class="hero-main"><div class="eyebrow">Jahangirnagar University · Savar, Dhaka</div><h1>Every campus issue.<br>One clear solution.</h1><p>The official-style digital complaint portal concept for Jahangirnagar University. Report campus maintenance, medical, network, and other service issues to the administration.</p><div class="hero-buttons"><button class="btn btn-light" onclick="startComplaint()">＋ Report an issue</button><button class="btn btn-outline" style="background:transparent;color:white;border-color:#ffffff66" onclick="openTracking()">Track a complaint ↗</button></div></div><aside class="hero-side"><div><div class="side-title">CAMPUS SERVICE OVERVIEW</div><div class="side-number">${s.resolved}<span style="font-size:17px;color:var(--green)"> resolved</span></div><div class="side-caption">Issues marked resolved in the portal</div></div><div class="mini-stats"><div class="mini-stat"><strong>${s.total}</strong><span>Total reports</span></div><div class="mini-stat"><strong>${s.progress}</strong><span>In progress</span></div><div class="mini-stat"><strong>${s.pending}</strong><span>Awaiting review</span></div><div class="mini-stat"><strong>${Object.keys(DEPTS).length}</strong><span>Service departments</span></div></div></aside></section><div class="section-head"><div><h2>Campus service departments</h2><p>Every complaint is routed to the team best equipped to resolve it.</p></div></div><section class="grid">${Object.entries(DEPTS).map(([name,d])=>`<article class="card"><div class="dept-icon">${d.icon}</div><h3>${name}</h3><p>${d.desc}</p><div class="card-foot"><span>Open assignments</span><strong>${list.filter(c=>c.department===name&&c.status!=='Resolved').length}</strong></div></article>`).join('')}</section><div class="section-head"><div><h2>Built around accountability</h2><p>Clear steps for students, administrators and maintenance teams.</p></div></div><section class="features"><article class="card feature"><div class="dept-icon">📸</div><div><h3>Evidence that helps</h3><p>Attach a photo so the team understands the issue before arriving.</p></div></article><article class="card feature"><div class="dept-icon">🔎</div><div><h3>Track every update</h3><p>Follow pending, in-progress and resolved status from your dashboard.</p></div></article><article class="card feature"><div class="dept-icon">🎯</div><div><h3>Urgency first</h3><p>Administrators set priority and route complaints to the right department.</p></div></article></section><div class="section-head"><div><h2>Private complaint tracking</h2><p>Complaint details and ongoing cases are not shown publicly.</p></div><button class="btn btn-outline" onclick="showLogin('student')">Open student portal ↗</button></div><section class="panel"><div class="notice"><strong>Privacy by design</strong>Student complaint details and ongoing issues are private. Students can view only complaints they personally submitted after signing in. Administrators can review and assign all reports.</div></section></div>`}
function showLogin(role='student'){state.view='login';const isAdmin=role==='admin',isDept=role==='department';const config=isDept?{title:'Department staff sign in',sub:'Sign in with your department email and password to view assignments from the administrator.',label:'DEPARTMENT ACCESS'}:isAdmin?{title:'Administrator sign in',sub:'Manage all complaints, set priorities, and assign work to specialist departments.',label:'ADMIN ACCESS'}:{title:'Jahangirnagar University student sign in',sub:'Sign in to report a JU campus issue or privately track complaints you submitted.',label:'STUDENT ACCESS'};document.getElementById('headerRole').textContent=config.label;document.getElementById('headerLogin').classList.add('hidden');document.getElementById('app').innerHTML=`<div class="login-shell"><section class="login-box"><div class="role-label">${config.label}</div><h1>${config.title}</h1><p>${config.sub}</p><div id="loginError"></div><form onsubmit="login(event)"><div class="form-row"><label>Email address</label><input id="loginEmail" type="email" required autocomplete="username" placeholder="you@campus.edu"></div><div class="form-row"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password" placeholder="Enter password"></div><button class="btn btn-primary full" type="submit">Sign in securely →</button></form>${!isAdmin&&!isDept?`<div class="switch-link">New to JU CampusCare? <span class="link" onclick="showStudentRegister()">Create student account</span></div>`:''}<div class="switch-link">${isAdmin?'Student?':isDept?'Student?':'Administrator?'} <span class="link" onclick="showLogin('${isAdmin?'student':'admin'}')">${isAdmin||isDept?'Student sign in':'Admin sign in'}</span></div>${isAdmin?'<div class="notice"><strong>Administrator demo account</strong>admin@campuscare.edu · Admin@123</div>':''}${isDept?'<div class="notice">Use your assigned department email and password.</div>':''}<div class="switch-link"><span class="link" onclick="showLogin('department')">Department staff sign in</span></div><div class="switch-link">${!isDept?'<span class="link" onclick="showLogin(\'department\')">Department sign in</span>':'<span class="link" onclick="showLogin(\'student\')">Student sign in</span>'}</div><div class="switch-link"><span class="link" onclick="home()">← Back to home</span></div></section></div>`}
function showStudentRegister(){state.view='register';document.getElementById('headerRole').textContent='STUDENT REGISTRATION';document.getElementById('headerLogin').classList.add('hidden');document.getElementById('app').innerHTML=`<div class="login-shell"><section class="login-box"><div class="role-label">JU STUDENT ACCESS</div><h1>Create student account</h1><p>Enter your Jahangirnagar University student details to register for CampusCare.</p><div id="registerError"></div><form onsubmit="registerStudent(event)"><div class="form-row"><label>Full Name *</label><input id="regName" required maxlength="100" autocomplete="name" placeholder="Your full name"></div><div class="form-row"><label>Department / Institute *</label><input id="regDepartment" required maxlength="120" placeholder="e.g. Institute of Information Technology"></div><div class="two-col"><div class="form-row"><label>Batch *</label><input id="regBatch" required maxlength="40" placeholder="e.g. 53rd Batch"></div><div class="form-row"><label>Hall Name *</label><input id="regHall" required maxlength="120" placeholder="Your residential hall"></div></div><div class="form-row"><label>University Email *</label><input id="regEmail" type="email" required autocomplete="email" placeholder="your email address"></div><div class="form-row"><label>Password *</label><input id="regPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><button class="btn btn-primary full" type="submit">Create account →</button></form><div class="switch-link">Already registered? <span class="link" onclick="showLogin('student')">Sign in</span></div><div class="switch-link">${!isDept?'<span class="link" onclick="showLogin(\'department\')">Department sign in</span>':'<span class="link" onclick="showLogin(\'student\')">Student sign in</span>'}</div><div class="switch-link"><span class="link" onclick="home()">← Back to home</span></div></section></div>`}
function registerStudent(e){e.preventDefault();const email=document.getElementById('regEmail').value.trim().toLowerCase();if(state.users.some(u=>u.email.toLowerCase()===email)){document.getElementById('registerError').innerHTML='<div class="error">An account with this email already exists. Please sign in.</div>';return}const user={id:'u-'+Date.now(),name:document.getElementById('regName').value.trim(),department:document.getElementById('regDepartment').value.trim(),batch:document.getElementById('regBatch').value.trim(),hallName:document.getElementById('regHall').value.trim(),email,password:document.getElementById('regPassword').value,role:'student'};state.users.push(user);save();state.user={id:user.id,name:user.name,email:user.email,role:'student',department:user.department,batch:user.batch,hallName:user.hallName};localStorage.setItem('cc_session',JSON.stringify(state.user));toast('Student account created successfully');renderDashboard()}
function login(e){e.preventDefault();const email=document.getElementById('loginEmail').value.trim().toLowerCase(),pass=document.getElementById('loginPass').value;const expectedRole=document.getElementById('headerRole').textContent==='DEPARTMENT ACCESS'?'department':document.getElementById('headerRole').textContent==='ADMIN ACCESS'?'admin':'student';const u=state.users.find(x=>x.email.toLowerCase()===email&&x.password===pass&&x.role===expectedRole);if(!u||(state.view==='login'&&document.getElementById('headerRole').textContent==='DEPARTMENT ACCESS'&&u.role!=='department')||(state.view==='login'&&document.getElementById('headerRole').textContent==='ADMIN ACCESS'&&u.role!=='admin')||(state.view==='login'&&document.getElementById('headerRole').textContent==='STUDENT ACCESS'&&u.role!=='student')){document.getElementById('loginError').innerHTML='<div class="error">Email or password is incorrect. Check your details or create a student account.</div>';return}state.user={id:u.id,name:u.name,email:u.email,role:u.role,department:u.department||null,batch:u.batch||'',hallName:u.hallName||''};localStorage.setItem('cc_session',JSON.stringify(state.user));toast('Signed in successfully');renderDashboard()}
function logout(){state.user=null;localStorage.removeItem('cc_session');home();toast('You have been signed out')}
function renderDashboard(){if(!state.user){home();return}document.getElementById('headerRole').textContent=state.user.role==='admin'?'ADMINISTRATOR CONSOLE':state.user.role==='department'?`${state.user.department.toUpperCase()} DEPARTMENT`:'STUDENT DASHBOARD';document.getElementById('headerLogin').classList.add('hidden');document.getElementById('headerLogout').classList.remove('hidden');if(state.user.role==='admin')adminDashboard();else if(state.user.role==='department')departmentDashboard();else studentDashboard()}
function statCards(s,dept=false){return `<div class="stats-grid"><div class="stat-card"><div class="stat-top">Total complaints <span>▤</span></div><strong>${s.total}</strong><small>All recorded reports</small></div><div class="stat-card"><div class="stat-top">Pending <span>◷</span></div><strong>${s.pending}</strong><small>Waiting for action</small></div><div class="stat-card"><div class="stat-top">In progress <span>↗</span></div><strong>${s.progress}</strong><small>Currently being handled</small></div><div class="stat-card"><div class="stat-top">Resolved <span>✓</span></div><strong>${s.resolved}</strong><small>Completed complaints</small></div></div>`}
function adminDashboard(){state.view='admin';const list=allComplaints(),s=stats(list);document.getElementById('app').innerHTML=`<div class="view"><div class="page-head"><div><h1>Administrator console</h1><p>Welcome, ${esc(state.user.name)}. Review reports and route each issue to the right team.</p></div><button class="btn btn-primary" onclick="showNewUser()">＋ Add student account</button></div>${statCards(s)}<section class="grid" style="margin-bottom:22px">${Object.entries(DEPTS).map(([n,d])=>`<article class="card"><div class="dept-icon">${d.icon}</div><h3>${n} Department</h3><p>${d.desc}</p><div class="card-foot"><span>Active work</span><strong>${list.filter(c=>c.department===n&&c.status!=='Resolved').length}</strong></div></article>`).join('')}</section><section class="panel"><div class="panel-head"><h2>All complaints <span class="badge">${list.length} records</span></h2><button class="btn btn-outline" onclick="exportCSV()">↓ Export CSV</button></div><div class="filters"><input class="control" placeholder="Search title, ID, student..." oninput="setFilter('q',this.value)" value="${esc(state.filters.q)}"><select class="control" onchange="setFilter('status',this.value)">${options(['All','Pending','In Progress','Resolved'],state.filters.status,'All statuses')}</select><select class="control" onchange="setFilter('department',this.value)">${options(['All',...Object.keys(DEPTS)],state.filters.department,'All departments')}</select><select class="control" onchange="setFilter('priority',this.value)">${options(['All','High','Medium','Low'],state.filters.priority,'All priorities')}</select></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Complaint / Student</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned department</th><th>ETA</th><th>Actions</th></tr></thead><tbody>${filtered(list).map(c=>`<tr><td><div class="complaint-title">${esc(c.title)}</div><div class="subtext">${esc(c.id)} · ${esc(c.studentName)} · ${fmt(c.createdAt)}</div></td><td>${esc(c.category)}</td><td>${badgePriority(c.priority)}</td><td>${badgeStatus(c.status)}</td><td>${c.department?`${DEPTS[c.department]?.icon||'🛠️'} ${esc(c.department)}`:'<span style="color:#b7791f">Unassigned</span>'}</td><td>${fmt(c.eta)}</td><td><div class="actions"><button class="icon-btn" onclick="editComplaint('${c.id}')">Manage</button><button class="icon-btn" onclick="viewComplaint('${c.id}')">View</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No complaints match these filters.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Student accounts</h2><span class="badge">${state.users.filter(u=>u.role==='student').length} students</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Account</th></tr></thead><tbody>${state.users.filter(u=>u.role==='student').map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge b-resolved">Active</span></td></tr>`).join('')}</tbody></table></div></section></div>`}
function departmentDashboard(){state.view='department';const dep=state.user.department,list=allComplaints().filter(c=>c.department===dep),s=stats(list);document.getElementById('app').innerHTML=`<div class="view"><div class="page-head"><div><h1>${esc(dep)} Department workspace</h1><p>Review assignments routed by the campus administrator and keep students informed.</p></div><span class="pill">SPECIALIST TEAM</span></div><div class="dept-banner"><div><h2>${DEPTS[dep]?.icon||'🛠️'} ${esc(dep)} maintenance team</h2><p>${DEPTS[dep]?.desc||'Campus maintenance assignments'}</p></div><div><div style="font-size:28px;font-weight:850">${s.total}</div><div style="font-size:11px;color:#d9eaf4">assigned complaints</div></div></div>${statCards(s,true)}<section class="panel"><div class="panel-head"><h2>My department assignments</h2><span class="badge">${list.filter(c=>c.status!=='Resolved').length} active</span></div><div class="filters"><input class="control" placeholder="Search complaint..." oninput="setFilter('q',this.value)" value="${esc(state.filters.q)}"><select class="control" onchange="setFilter('status',this.value)">${options(['All','Pending','In Progress','Resolved'],state.filters.status,'All statuses')}</select><select class="control" onchange="setFilter('priority',this.value)">${options(['All','High','Medium','Low'],state.filters.priority,'All priorities')}</select></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Complaint</th><th>Location</th><th>Priority</th><th>Status</th><th>ETA</th><th>Action</th></tr></thead><tbody>${filtered(list).map(c=>`<tr><td><div class="complaint-title">${esc(c.title)}</div><div class="subtext">${esc(c.id)} · ${esc(c.studentName)} · ${fmt(c.createdAt)}</div></td><td>${esc(c.location)}</td><td>${badgePriority(c.priority)}</td><td>${badgeStatus(c.status)}</td><td>${fmt(c.eta)}</td><td><div class="actions"><button class="icon-btn" onclick="departmentUpdate('${c.id}')">Update</button><button class="icon-btn" onclick="viewComplaint('${c.id}')">Details</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No complaints assigned to your department yet.</td></tr>'}</tbody></table></div></section></div>`}
function studentDashboard(){state.view='student';const list=allComplaints().filter(c=>c.studentId===state.user.id),s=stats(list);document.getElementById('app').innerHTML=`<div class="view"><div class="page-head"><div><h1>JU Student dashboard</h1><p>Hello, ${esc(state.user.name)}. Your complaints are private and visible only to you and authorized staff.</p></div><button class="btn btn-primary" onclick="startComplaint()">＋ New complaint</button></div>${statCards(s)}<section class="panel"><div class="panel-head"><h2>Your JU profile</h2><span class="badge">Student account</span></div><div class="two-col"><div><div class="subtext">NAME</div><strong>${esc(state.user.name)}</strong></div><div><div class="subtext">DEPARTMENT / INSTITUTE</div><strong>${esc(state.user.department||'Not provided')}</strong></div><div><div class="subtext">BATCH</div><strong>${esc(state.user.batch||'Not provided')}</strong></div><div><div class="subtext">HALL NAME</div><strong>${esc(state.user.hallName||'Not provided')}</strong></div></div></section><section class="panel"><div class="panel-head"><h2>My complaints</h2><span class="badge">${list.length} reports</span></div><div class="table-wrap"><table><thead><tr><th>Complaint</th><th>Department</th><th>Priority</th><th>Status</th><th>ETA</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="complaint-title">${esc(c.title)}</div><div class="subtext">${esc(c.id)} · ${esc(c.location)} · ${fmt(c.createdAt)}</div></td><td>${DEPTS[c.department]?.icon||'🛠️'} ${esc(c.department||'Awaiting assignment')}</td><td>${badgePriority(c.priority)}</td><td>${badgeStatus(c.status)}</td><td>${fmt(c.eta)}</td><td><button class="icon-btn" onclick="viewComplaint('${c.id}')">Track progress</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">You have not submitted a complaint yet. Click “New complaint” to get started.</td></tr>'}</tbody></table></div></section><div class="notice"><strong>What happens next?</strong>Your complaint is saved, reviewed by an administrator, assigned to a relevant department, and updated as work progresses. You can follow every status change here.</div></div>`}
function options(items,current,first){return items.map((x,i)=>`<option value="${esc(x)}" ${x===current?'selected':''}>${i===0&&first?first:esc(x==='All'&&first?first:x)}</option>`).join('')}
function filtered(list){return list.filter(c=>(state.filters.status==='All'||c.status===state.filters.status)&&(state.filters.department==='All'||c.department===state.filters.department)&&(state.filters.priority==='All'||c.priority===state.filters.priority)&&(!state.filters.q||`${c.id} ${c.title} ${c.studentName} ${c.location}`.toLowerCase().includes(state.filters.q.toLowerCase())))}
function setFilter(k,v){state.filters[k]=v;renderDashboard()}
function startComplaint(){if(!state.user){showLogin('student');return}if(state.user.role!=='student'){toast('Sign in with a student account to submit a complaint');return}showComplaintForm()}
function showComplaintForm(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Report a campus issue</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="submitComplaint(event)"><div class="form-row"><label>Complaint title *</label><input id="cTitle" required maxlength="100" placeholder="e.g. Water leakage near Block B"></div><div class="two-col"><div class="form-row"><label>Issue category *</label><select id="cCategory" required>${Object.keys(DEPTS).map(n=>`<option>${n}</option>`).join('')}</select></div><div class="form-row"><label>Campus location / Hall / Building *</label><input id="cLocation" required maxlength="120" placeholder="JU hall, department, building, floor, or room"></div></div><div class="form-row"><label>Describe the problem *</label><textarea id="cDescription" required maxlength="1500" placeholder="Explain what happened and where. Include any safety concern."></textarea></div><div class="two-col"><div class="form-row"><label>Urgency (suggested)</label><select id="cPriority"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="form-row"><label>Photo evidence (optional)</label><input id="cImage" type="file" accept="image/*" onchange="previewImage(this)"><div id="imagePreview"></div></div></div><div class="notice">A Jahangirnagar University administrator will review the issue and assign it to the relevant department. The selected category helps routing, but the administrator makes the final assignment.</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button class="btn btn-light" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Submit complaint →</button></div></form></section></div>`}
let pendingImage=null;function previewImage(input){const f=input.files?.[0];if(!f){pendingImage=null;return}if(f.size>1200000){toast('Choose an image under 1.2 MB for this browser demo');input.value='';pendingImage=null;return}const r=new FileReader();r.onload=()=>{pendingImage=r.result;document.getElementById('imagePreview').innerHTML=`<img class="photo-preview" src="${pendingImage}" alt="Complaint evidence preview">`};r.readAsDataURL(f)}
function submitComplaint(e){e.preventDefault();const category=document.getElementById('cCategory').value;const now=new Date().toISOString();const c={id:'CC-'+(1000+Math.floor(Math.random()*8999)),studentId:state.user.id,studentName:state.user.name,title:document.getElementById('cTitle').value.trim(),description:document.getElementById('cDescription').value.trim(),location:document.getElementById('cLocation').value.trim(),category,priority:document.getElementById('cPriority').value,status:'Pending',department:null,eta:'',image:pendingImage,createdAt:now,updatedAt:now,updates:[{status:'Submitted',note:'Complaint submitted by student and is awaiting administrator review.',date:now}]};state.complaints.unshift(c);save();pendingImage=null;closeModal();studentDashboard();toast(`Complaint ${c.id} submitted successfully`)}
function editComplaint(id){const c=state.complaints.find(x=>x.id===id);if(!c)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Manage ${esc(c.id)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice" style="margin:0 0 18px"><strong>${esc(c.title)}</strong>${esc(c.description)}<br>Submitted by ${esc(c.studentName)} · ${esc(c.location)}</div>${c.image?`<img class="photo-preview" src="${c.image}" alt="Complaint evidence">`:''}<form onsubmit="saveAdminUpdate(event,'${c.id}')"><div class="two-col"><div class="form-row"><label>Priority</label><select id="editPriority">${options(['High','Medium','Low'],c.priority)}</select></div><div class="form-row"><label>Assign department *</label><select id="editDepartment" required><option value="">Choose department</option>${Object.keys(DEPTS).map(n=>`<option ${c.department===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="two-col"><div class="form-row"><label>Complaint status</label><select id="editStatus">${options(['Pending','In Progress','Resolved'],c.status)}</select></div><div class="form-row"><label>Estimated resolution date</label><input id="editEta" type="date" value="${esc(c.eta||'')}"></div></div><div class="form-row"><label>Update note for student</label><textarea id="editNote" placeholder="e.g. Assigned to the team. Inspection scheduled for tomorrow."></textarea></div><div class="notice">Saving will assign this complaint to the selected department and add a status update to its history.</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:18px"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save and notify student</button></div></form></section></div>`}
function saveAdminUpdate(e,id){e.preventDefault();const c=state.complaints.find(x=>x.id===id);const status=document.getElementById('editStatus').value,department=document.getElementById('editDepartment').value,priority=document.getElementById('editPriority').value,eta=document.getElementById('editEta').value,note=document.getElementById('editNote').value.trim();if(!department){toast('Choose a department before saving');return}c.status=status;c.department=department;c.priority=priority;c.eta=eta;c.updatedAt=new Date().toISOString();c.updates.push({status,note:note||`Administrator assigned this complaint to ${department} Department and updated its status to ${status}.`,date:c.updatedAt});save();closeModal();adminDashboard();toast(`Complaint assigned to ${department} Department`)}
function departmentUpdate(id){const c=state.complaints.find(x=>x.id===id);if(!c)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Update assignment</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice"><strong>${esc(c.id)} · ${esc(c.title)}</strong>${esc(c.description)}<br>Location: ${esc(c.location)}</div><form onsubmit="saveDeptUpdate(event,'${c.id}')"><div class="two-col"><div class="form-row"><label>Work status</label><select id="deptStatus">${options(['Pending','In Progress','Resolved'],c.status)}</select></div><div class="form-row"><label>Estimated resolution date</label><input id="deptEta" type="date" value="${esc(c.eta||'')}"></div></div><div class="form-row"><label>Work update for student *</label><textarea id="deptNote" required placeholder="Explain inspection results, work started, or resolution details."></textarea></div><div style="display:flex;justify-content:flex-end;gap:9px"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Publish update</button></div></form></section></div>`}
function saveDeptUpdate(e,id){e.preventDefault();const c=state.complaints.find(x=>x.id===id);const status=document.getElementById('deptStatus').value,eta=document.getElementById('deptEta').value,note=document.getElementById('deptNote').value.trim();c.status=status;c.eta=eta;c.updatedAt=new Date().toISOString();c.updates.push({status,note,date:c.updatedAt});save();closeModal();departmentDashboard();toast('Student progress updated')}
function viewComplaint(id){const c=state.complaints.find(x=>x.id===id);if(!c)return;const allowed=state.user?.role==='admin'||state.user?.role==='department'&&state.user.department===c.department||state.user?.id===c.studentId;if(!allowed){toast('You do not have permission to view this complaint');return}document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><div><div class="subtext">${esc(c.id)} · ${fmt(c.createdAt)}</div><h2 style="margin-top:5px">${esc(c.title)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">${badgeStatus(c.status)}${badgePriority(c.priority)}<span class="badge">${DEPTS[c.department]?.icon||'🛠️'} ${esc(c.department||'Unassigned')}</span></div><div class="two-col"><div><div class="subtext">CATEGORY</div><strong>${esc(c.category)}</strong></div><div><div class="subtext">LOCATION</div><strong>${esc(c.location)}</strong></div><div><div class="subtext">REPORTED BY</div><strong>${esc(c.studentName)}</strong></div><div><div class="subtext">ESTIMATED RESOLUTION</div><strong>${fmt(c.eta)}</strong></div></div><div style="margin-top:17px"><div class="subtext">DESCRIPTION</div><p style="font-size:13px;line-height:1.6">${esc(c.description)}</p></div>${c.image?`<div><div class="subtext">PHOTO EVIDENCE</div><img class="photo-preview" src="${c.image}" alt="Complaint evidence"></div>`:''}<div style="margin-top:22px;font-weight:850">Progress history</div><div class="timeline">${[...c.updates].reverse().map(u=>`<div class="timeline-item"><strong>${esc(u.status)} · ${fmtTime(u.date)}</strong><p>${esc(u.note)}</p></div>`).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn btn-light" onclick="closeModal()">Close</button></div></section></div>`}
function openTracking(){if(state.user?.role==='student'){studentDashboard();return}showLogin('student')}
function showNewUser(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" style="max-width:500px"><div class="modal-head"><h2>Create student account</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="createStudent(event)"><div class="form-row"><label>Full name</label><input id="newName" required maxlength="80"></div><div class="form-row"><label>JU / University email</label><input id="newEmail" type="email" required></div><div class="form-row"><label>Department / Institute</label><input id="newDepartment" required placeholder="e.g. Institute of Information Technology"></div><div class="two-col"><div class="form-row"><label>Batch</label><input id="newBatch" required placeholder="e.g. 53rd Batch"></div><div class="form-row"><label>Hall Name</label><input id="newHall" required placeholder="e.g. M. A. Wazed Miah Hall"></div></div><div class="form-row"><label>Password</label><input id="newPassword" type="password" required minlength="8"></div><div style="display:flex;justify-content:flex-end;gap:9px"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Create account</button></div></form></section></div>`}
function createStudent(e){e.preventDefault();const email=document.getElementById('newEmail').value.trim().toLowerCase();if(state.users.some(u=>u.email.toLowerCase()===email)){toast('An account with that email already exists');return}state.users.push({id:'u-'+Date.now(),name:document.getElementById('newName').value.trim(),email,password:document.getElementById('newPassword').value,role:'student',department:document.getElementById('newDepartment').value.trim(),batch:document.getElementById('newBatch').value.trim(),hallName:document.getElementById('newHall').value.trim()});save();closeModal();adminDashboard();toast('Student account created')}
function exportCSV(){if(state.user?.role!=='admin')return;const rows=[['ID','Title','Student','Student Department','Batch','Hall Name','Location','Category','Priority','Status','Assigned Department','ETA','Created'],...allComplaints().map(c=>[c.id,c.title,c.studentName,state.users.find(u=>u.id===c.studentId)?.department||'',state.users.find(u=>u.id===c.studentId)?.batch||'',state.users.find(u=>u.id===c.studentId)?.hallName||'',c.location,c.category,c.priority,c.status,c.department||'',c.eta,c.createdAt])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='campuscare-complaints.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared')}
function closeModal(){document.getElementById('modalRoot').innerHTML='';pendingImage=null}
function toast(message){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
if(state.user&&!state.users.some(u=>u.id===state.user.id)){state.user=null;localStorage.removeItem('cc_session')}if(state.user)renderDashboard();else home();
</script></body></html>
